<style>
  .otn-shift-handover {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 12px 8px;
  }
  .otn-shift-handover-label {
    color: var(--bs-secondary-color);
    font-size: .75rem;
    font-weight: 600;
  }
  .otn-shift-handover-time-row {
    display: flex;
    align-items: stretch;
    gap: 6px;
  }
  .otn-shift-handover-time-row .form-control {
    min-width: 0;
  }
  .otn-shift-handover-arrows {
    display: flex;
    flex: 0 0 34px;
    flex-direction: column;
    gap: 3px;
  }
  .otn-shift-handover-arrow {
    align-items: center;
    display: flex;
    flex: 1 1 0;
    justify-content: center;
    line-height: 1;
    min-height: 0;
    padding: 0 8px;
  }
  .otn-shift-handover-generate {
    width: 100%;
  }
  .otn-shift-handover-error:empty {
    display: none;
  }
  #shiftHandoverText {
    min-height: 55vh;
    resize: vertical;
    white-space: pre-wrap;
  }
</style>

<div
  class="otn-shift-handover"
  data-check-url="{{ check_url }}"
  data-generate-url="{{ generate_url }}"
  id="shiftHandoverWidget"
>
  <label class="otn-shift-handover-label" for="shiftHandoverStart">
    班次开始时间
  </label>
  <div class="otn-shift-handover-time-row">
    <input
      class="form-control form-control-sm"
      id="shiftHandoverStart"
      type="datetime-local"
      value="{{ default_shift }}"
    >
    <div class="otn-shift-handover-arrows">
      <button
        aria-label="前一个班次"
        class="btn btn-outline-secondary btn-sm otn-shift-handover-arrow"
        data-shift-direction="previous"
        title="前一个班次"
        type="button"
      >▲</button>
      <button
        aria-label="后一个班次"
        class="btn btn-outline-secondary btn-sm otn-shift-handover-arrow"
        data-shift-direction="next"
        title="后一个班次"
        type="button"
      >▼</button>
    </div>
  </div>
  <button
    class="btn btn-primary btn-sm otn-shift-handover-generate"
    id="generateShiftHandover"
    type="button"
  >
    <i class="mdi mdi-swap-horizontal me-1"></i>生成交接班内容
  </button>
  <div
    class="alert alert-danger py-2 px-3 mb-0 small otn-shift-handover-error"
    id="shiftHandoverError"
    role="alert"
  ></div>
</div>

<div
  aria-hidden="true"
  aria-labelledby="shiftHandoverModalLabel"
  class="modal fade"
  id="shiftHandoverModal"
  tabindex="-1"
>
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="shiftHandoverModalLabel">交接班内容</h5>
        <button
          aria-label="关闭"
          class="btn-close"
          data-handover-action="close"
          data-bs-dismiss="modal"
          type="button"
        ></button>
      </div>
      <div class="modal-body">
        <textarea
          class="form-control font-monospace"
          id="shiftHandoverText"
          readonly
        ></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="copyShiftHandoverText" type="button">
          <i class="mdi mdi-content-copy me-1"></i>复制内容
        </button>
        <button
          class="btn btn-secondary"
          data-bs-dismiss="modal"
          data-handover-action="close"
          type="button"
        >
          关闭
        </button>
      </div>
    </div>
  </div>
</div>

<div
  aria-hidden="true"
  aria-labelledby="shiftHandoverOverdueCutoverModalLabel"
  class="modal fade"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  id="shiftHandoverOverdueCutoverModal"
  tabindex="-1"
>
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="shiftHandoverOverdueCutoverModalLabel">
          逾期待实施割接检查
        </h5>
      </div>
      <div class="modal-body">
        <div class="alert alert-warning" role="alert">
          下列割接可能已经实施完成，请检查修正状态
        </div>
        <div class="table-responsive" id="shiftHandoverOverdueCutoverTable">
          <table class="table table-hover table-sm align-middle mb-0">
            <thead>
              <tr>
                <th scope="col">割接编号</th>
                <th scope="col">计划割接时间</th>
                <th scope="col">省份</th>
                <th scope="col">割接类型</th>
                <th scope="col">A端</th>
                <th scope="col">Z端</th>
                <th scope="col">割接地点</th>
              </tr>
            </thead>
            <tbody id="shiftHandoverOverdueCutoverRows"></tbody>
          </table>
        </div>
        <div
          class="alert alert-danger mt-3 mb-0 d-none"
          id="shiftHandoverOverdueCutoverError"
          role="alert"
        ></div>
        <div
          class="alert alert-success mt-3 mb-0 d-none"
          id="shiftHandoverOverdueCutoverSuccess"
          role="status"
        ></div>
      </div>
      <div class="modal-footer" id="shiftHandoverOverdueCutoverActions">
        <button class="btn btn-secondary" id="skipOverdueCutoverCheck" type="button">
          跳过
        </button>
        <button class="btn btn-primary" id="recheckOverdueCutovers" type="button">
          <i class="mdi mdi-refresh me-1"></i>再次检查
        </button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const root = document.getElementById('shiftHandoverWidget');
  const input = document.getElementById('shiftHandoverStart');
  const generateButton = document.getElementById('generateShiftHandover');
  const errorBox = document.getElementById('shiftHandoverError');
  const modalElement = document.getElementById('shiftHandoverModal');
  const output = document.getElementById('shiftHandoverText');
  const copyButton = document.getElementById('copyShiftHandoverText');
  const overdueModalElement = document.getElementById('shiftHandoverOverdueCutoverModal');
  const overdueRows = document.getElementById('shiftHandoverOverdueCutoverRows');
  const overdueTable = document.getElementById('shiftHandoverOverdueCutoverTable');
  const warningError = document.getElementById('shiftHandoverOverdueCutoverError');
  const warningSuccess = document.getElementById('shiftHandoverOverdueCutoverSuccess');
  const actionsElement = document.getElementById('shiftHandoverOverdueCutoverActions');
  const skipButton = document.getElementById('skipOverdueCutoverCheck');
  const recheckButton = document.getElementById('recheckOverdueCutovers');
  const checkUrl = root.dataset.checkUrl;
  const generateUrl = root.dataset.generateUrl;
  const generateLabel = generateButton.innerHTML;
  const copyLabel = copyButton.innerHTML;
  let manualBackdrop = null;
  let overdueBackdrop = null;

  function showShiftHandoverModal() {
    if (window.bootstrap && window.bootstrap.Modal) {
      window.bootstrap.Modal.getOrCreateInstance(modalElement).show();
      return;
    }
    modalElement.style.display = 'block';
    modalElement.classList.add('show');
    modalElement.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
    manualBackdrop = document.createElement('div');
    manualBackdrop.className = 'modal-backdrop fade show';
    document.body.appendChild(manualBackdrop);
  }

  function hideShiftHandoverModalFallback() {
    if (window.bootstrap && window.bootstrap.Modal) return;
    modalElement.style.display = 'none';
    modalElement.classList.remove('show');
    modalElement.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    if (manualBackdrop) manualBackdrop.remove();
    manualBackdrop = null;
  }

  function showOverdueCutoverModal() {
    if (window.bootstrap && window.bootstrap.Modal) {
      window.bootstrap.Modal.getOrCreateInstance(overdueModalElement, {
        backdrop: 'static',
        keyboard: false,
      }).show();
      return;
    }
    overdueModalElement.style.display = 'block';
    overdueModalElement.classList.add('show');
    overdueModalElement.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
    overdueBackdrop = document.createElement('div');
    overdueBackdrop.className = 'modal-backdrop fade show';
    document.body.appendChild(overdueBackdrop);
  }

  function hideOverdueCutoverModal() {
    if (window.bootstrap && window.bootstrap.Modal) {
      window.bootstrap.Modal.getOrCreateInstance(overdueModalElement).hide();
      return;
    }
    overdueModalElement.style.display = 'none';
    overdueModalElement.classList.remove('show');
    overdueModalElement.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    if (overdueBackdrop) overdueBackdrop.remove();
    overdueBackdrop = null;
  }

  function resetGenerateButton() {
    generateButton.disabled = false;
    generateButton.innerHTML = generateLabel;
  }

  function setWarningButtonsDisabled(disabled) {
    skipButton.disabled = disabled;
    recheckButton.disabled = disabled;
  }

  function resetWarningState() {
    warningError.textContent = '';
    warningError.classList.add('d-none');
    warningSuccess.textContent = '';
    warningSuccess.classList.add('d-none');
    overdueTable.classList.remove('d-none');
    actionsElement.classList.remove('d-none');
    setWarningButtonsDisabled(false);
  }

  function renderOverdueCutovers(cutovers) {
    overdueRows.replaceChildren();
    cutovers.forEach(cutover => {
      const row = document.createElement('tr');
      const numberCell = document.createElement('td');
      const link = document.createElement('a');
      link.href = cutover.edit_url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = cutover.cutover_no;
      numberCell.appendChild(link);
      row.appendChild(numberCell);
      ['planned_cutover_time', 'province', 'cutover_type', 'a_end', 'z_end', 'location']
        .forEach(field => {
          const cell = document.createElement('td');
          cell.textContent = cutover[field];
          row.appendChild(cell);
        });
      overdueRows.appendChild(row);
    });
  }

  async function fetchOverdueCutovers() {
    const response = await fetch(checkUrl, {
      headers: { 'X-Requested-With': 'XMLHttpRequest' },
    });
    const payload = await response.json();
    if (!response.ok) {
      throw new Error(payload.error || '检查逾期待实施割接失败，请稍后重试。');
    }
    return payload.cutovers;
  }

  async function generateShiftHandoverContent() {
    const params = new URLSearchParams({ shift_start: input.value });
    const response = await fetch(`${generateUrl}?${params.toString()}`, {
      headers: { 'X-Requested-With': 'XMLHttpRequest' },
    });
    const payload = await response.json();
    if (!response.ok) {
      throw new Error(payload.error || '生成交接班内容失败，请稍后重试。');
    }
    output.value = payload.text;
    showShiftHandoverModal();
    resetGenerateButton();
  }

  function parseLocalDateTime(value) {
    if (!value) return null;
    const selected = new Date(value);
    return Number.isNaN(selected.getTime()) ? null : selected;
  }

  function formatLocalDateTime(value) {
    const pad = number => String(number).padStart(2, '0');
    return `${value.getFullYear()}-${pad(value.getMonth() + 1)}-${pad(value.getDate())}`
      + `T${pad(value.getHours())}:${pad(value.getMinutes())}`;
  }

  function moveToAdjacentShift(direction) {
    const selected = parseLocalDateTime(input.value);
    if (!selected) return;
    const selectedHour = selected.getHours() + (selected.getMinutes() / 60);
    const target = new Date(selected);
    target.setSeconds(0, 0);

    if (direction === 'previous') {
      if (selectedHour > 18) {
        target.setHours(18, 0, 0, 0);
      } else if (selectedHour > 9) {
        target.setHours(9, 0, 0, 0);
      } else {
        target.setDate(target.getDate() - 1);
        target.setHours(18, 0, 0, 0);
      }
    } else if (selectedHour < 9) {
      target.setHours(9, 0, 0, 0);
    } else if (selectedHour < 18) {
      target.setHours(18, 0, 0, 0);
    } else {
      target.setDate(target.getDate() + 1);
      target.setHours(9, 0, 0, 0);
    }
    input.value = formatLocalDateTime(target);
  }

  root.querySelectorAll('[data-shift-direction]').forEach(button => {
    button.addEventListener('click', () => {
      moveToAdjacentShift(button.dataset.shiftDirection);
    });
  });

  generateButton.addEventListener('click', async () => {
    errorBox.textContent = '';
    if (!parseLocalDateTime(input.value)) {
      errorBox.textContent = '请选择有效的班次开始时间。';
      return;
    }

    generateButton.disabled = true;
    generateButton.textContent = '正在检查…';
    try {
      const cutovers = await fetchOverdueCutovers();
      if (cutovers.length) {
        resetWarningState();
        renderOverdueCutovers(cutovers);
        showOverdueCutoverModal();
      } else {
        generateButton.textContent = '正在生成…';
        await generateShiftHandoverContent();
      }
    } catch (error) {
      errorBox.textContent = error.message || '检查逾期待实施割接失败，请稍后重试。';
      resetGenerateButton();
    }
  });

  skipButton.addEventListener('click', async () => {
    setWarningButtonsDisabled(true);
    hideOverdueCutoverModal();
    generateButton.textContent = '正在生成…';
    try {
      await generateShiftHandoverContent();
    } catch (error) {
      errorBox.textContent = error.message || '生成交接班内容失败，请稍后重试。';
      resetGenerateButton();
    }
  });

  function startCompletedCheckCountdown() {
    actionsElement.classList.add('d-none');
    overdueTable.classList.add('d-none');
    warningSuccess.classList.remove('d-none');
    let remainingSeconds = 5;
    const renderCountdown = () => {
      warningSuccess.textContent = `已经完成检查，${remainingSeconds}秒后自动进入交接班信息窗口。`;
    };
    renderCountdown();
    const timer = window.setInterval(async () => {
      remainingSeconds -= 1;
      if (remainingSeconds > 0) {
        renderCountdown();
        return;
      }
      window.clearInterval(timer);
      hideOverdueCutoverModal();
      generateButton.textContent = '正在生成…';
      try {
        await generateShiftHandoverContent();
      } catch (error) {
        errorBox.textContent = error.message || '生成交接班内容失败，请稍后重试。';
        resetGenerateButton();
      }
    }, 1000);
  }

  recheckButton.addEventListener('click', async () => {
    warningError.textContent = '';
    warningError.classList.add('d-none');
    setWarningButtonsDisabled(true);
    try {
      const cutovers = await fetchOverdueCutovers();
      if (cutovers.length) {
        renderOverdueCutovers(cutovers);
        setWarningButtonsDisabled(false);
      } else {
        startCompletedCheckCountdown();
      }
    } catch (error) {
      warningError.textContent = error.message || '检查逾期待实施割接失败，请稍后重试。';
      warningError.classList.remove('d-none');
      setWarningButtonsDisabled(false);
    }
  });

  function setCopyFeedback(message) {
    if (message === '已复制') {
      copyButton.innerHTML = '<i class="mdi mdi-check me-1"></i>已复制';
    } else {
      copyButton.textContent = message;
    }
    copyButton.disabled = true;
    window.setTimeout(() => {
      copyButton.innerHTML = copyLabel;
      copyButton.disabled = false;
    }, 1500);
  }

  function fallbackCopy(text) {
    const copyArea = document.createElement('textarea');
    copyArea.value = text;
    copyArea.setAttribute('readonly', '');
    copyArea.style.position = 'fixed';
    copyArea.style.opacity = '0';
    document.body.appendChild(copyArea);
    try {
      copyArea.select();
      copyArea.setSelectionRange(0, copyArea.value.length);
      return document.execCommand('copy');
    } catch (error) {
      return false;
    } finally {
      copyArea.remove();
    }
  }

  async function copyShiftHandoverText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (error) {
        // Continue with the DOM fallback.
      }
    }
    return fallbackCopy(text);
  }

  copyButton.addEventListener('click', async () => {
    const copied = await copyShiftHandoverText(output.value);
    if (copied) {
      setCopyFeedback('已复制');
    } else {
      setCopyFeedback('复制失败');
    }
  });

  modalElement.querySelectorAll('[data-handover-action="close"]').forEach(button => {
    button.addEventListener('click', hideShiftHandoverModalFallback);
  });
  modalElement.addEventListener('click', event => {
    if (event.target === modalElement) hideShiftHandoverModalFallback();
  });
})();
</script>
